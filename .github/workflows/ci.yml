name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      E2E_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/ledger-core-client/package-lock.json
            e2e/package-lock.json

      - name: Backend – build
        run: dotnet build src/LedgerCore.sln -c Release

      - name: Testy jednostkowe (domena + aplikacja)
        run: dotnet test src/LedgerCore.sln -c Release --no-build

      - name: UI – build
        working-directory: src/ledger-core-client
        run: |
          npm ci
          npm run build

      - name: E2E – instalacja Playwrighta
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E – testy
        working-directory: e2e
        run: npx playwright test

      - name: Raport Playwrighta
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
